name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # One APK holds both halves: the app, and the shell-side host compiled in from
      # server/ and launched by app_process against this same artifact.
      - run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: minimont-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
